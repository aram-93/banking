server.port=9091

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/newrealm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/newrealm/protocol/openid-connect/certs

# Tell Spring Security to use the 'roles' claim as authorities
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.claims-authority-prefix=ROLE_
keycloak.client-id=my-api


# (Optional) Log level for debugging
logging.level.org.springframework.security=DEBUG


